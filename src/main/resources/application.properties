spring.application.name=job-dispatcher-java

# ---- 本地作业调度器配置 ----
# 最大并发执行容量（在途租约上限）
job-dispatcher.max-concurrent=4
# 等待队列容量（仅排队数超限才拒绝；容量占满只排队）
job-dispatcher.max-queue-size=1000
# 执行租约时长；执行方每 1/3 时长心跳续期
job-dispatcher.lease-duration=30s
# 最大执行次数（首次执行 + 重试次数）
job-dispatcher.max-attempts=3
# 重试退避：指数翻倍 + 抖动，上限 max-backoff
job-dispatcher.initial-backoff=2s
job-dispatcher.max-backoff=60s
# 调度/租约扫描周期
job-dispatcher.poll-interval=100ms
job-dispatcher.sweep-interval=200ms
